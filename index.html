<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Musicfy — Streaming Muzik Premium" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>AnytimeHitz — Streaming Hitz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
        <div class="brand-name">Musicfy</div>
      </div>

      <nav class="nav">
        <a class="nav-link active" data-page="home">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </a>
        <a class="nav-link" data-page="search">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
          <span>Search</span>
        </a>
        <a class="nav-link" data-page="library">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14a2 2 0 0 0 2 2h14v-2H4V6zm16-4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
          <span>Your Library</span>
        </a>
      </nav>

      <div class="playlists-section">
        <h4>Your Playlists</h4>
        <ul id="playlist-list" class="playlist-list">
          <li class="playlist-item" data-playlist="liked">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            Liked Songs
          </li>
        </ul>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="back-btn" title="Kembali">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <button class="icon-btn" id="forward-btn" title="Ke Hadapan">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
          </button>
        </div>
        <div class="topbar-right">
          <button class="user-badge" id="user-badge" title="Log Masuk">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </button>
        </div>
      </header>

      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- PLAYER -->
  <footer class="player">
    <div class="np">
      <div class="np-art-wrap">
        <img id="np-art" class="np-art" alt="" />
        <div class="np-art-overlay"></div>
      </div>
      <div class="np-info">
        <div class="np-title" id="np-title">Not playing</div>
        <div class="np-artist" id="np-artist">Select a track</div>
      </div>
      <button class="icon-btn like-btn" id="like-btn" title="Like">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>
      </button>
    </div>

    <div class="player-center">
      <div class="controls">
        <button class="ctrl-btn" id="shuffle-btn" title="Shuffle">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="ctrl-btn" id="prev-btn" title="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="play-pause" id="play-btn" title="Play">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn" id="next-btn" title="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="ctrl-btn" id="repeat-btn" title="Repeat">
          <svg class="icon-repeat" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          <svg class="icon-repeat-one" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>
        </button>
      </div>
      <div class="progress-wrap">
        <span class="time" id="current-time">0:00</span>
        <input type="range" id="progress" min="0" max="1000" value="0" />
        <span class="time" id="duration">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="ctrl-btn" id="vol-btn" title="Mute">
        <svg class="icon-vol" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <svg class="icon-vol-low" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></svg>
        <svg class="icon-vol-mute" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      </button>
      <input type="range" id="volume" min="0" max="100" value="70" />
    </div>
  </footer>

  <!-- LOGIN MODAL -->
  <div class="modal-overlay" id="login-modal" hidden>
    <div class="modal">
      <button class="modal-close" id="modal-close" title="Tutup">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <h2 class="modal-title">Log Masuk ke Musicfy</h2>
      <p class="modal-sub">Segerakkan liked songs merentas semua peranti anda.</p>

      <button class="btn-google" id="btn-google">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Teruskan dengan Google
      </button>

      <div class="divider"><span>atau</span></div>

      <div id="otp-step-1">
        <label class="field-label">Log masuk dengan emel</label>
        <input type="email" id="email-input" class="field-input" placeholder="nama@emel.com" />
        <button class="btn-primary" id="btn-send-otp">Hantar Kod OTP</button>
      </div>

      <div id="otp-step-2" hidden>
        <label class="field-label">Kod 6-digit dihantar ke <b id="otp-email-display"></b></label>
        <input type="text" id="otp-input" class="field-input otp-input" maxlength="6" inputmode="numeric" placeholder="000000" />
        <button class="btn-primary" id="btn-verify-otp">Sahkan</button>
        <button class="btn-text" id="btn-resend-otp">Hantar semula kod</button>
        <button class="btn-text" id="btn-change-email">Tukar emel</button>
      </div>

      <div class="modal-error" id="modal-error"></div>
      <div class="modal-info" id="modal-info"></div>
    </div>
  </div>

  <!-- USER MENU -->
  <div class="user-menu" id="user-menu" hidden>
    <div class="user-menu-header">
      <img id="menu-avatar" class="menu-avatar" alt="" />
      <div class="user-menu-info">
        <div class="menu-name" id="menu-name">User</div>
        <div class="menu-email" id="menu-email">user@email.com</div>
      </div>
    </div>
    <button class="menu-item" id="menu-logout">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
      Log Keluar
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
